<div class="selector-container">
  <div class="field" *ngIf="sources().length > 1">
    <label for="source">{{ 'reg.source' | t }}</label>
    <select id="source" [(ngModel)]="selectedSourceId" (change)="onSourceChange()">
      <option *ngFor="let s of sources()" [value]="s.id_source">
        {{ s.nombre }}
      </option>
    </select>
  </div>

  <div class="field">
    <label for="region">{{ 'reg.region' | t }}</label>
    <select id="region" [(ngModel)]="selectedRegionId" (change)="onRegionChange()">
      <option *ngFor="let region of regions()" [value]="region.id">
        {{ region.name }}
      </option>
    </select>
  </div>

  <div class="field">
    <label for="resolution">{{ 'reg.resolution' | t }}</label>
    <!-- El value ahora es el grid_id; mostramos la etiqueta resolution -->
    <select id="resolution" [(ngModel)]="selectedGridId" (change)="onResolutionChange()">
      <option *ngFor="let res of resolutions()" [value]="res.grid_id">
        {{ res.resolution }}
      </option>
    </select>
  </div>
</div>
